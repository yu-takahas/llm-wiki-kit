<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="648" height="356" viewBox="0 0 648 356" version="1.1"
     style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:1.5;">

  <!-- llm-wiki-kit ロゴ。
       アームは関節ごとの入れ子（肩 > 肘 > 手首）で、各グループを回すと下流が連動する。
       KIT は 1 文字ずつ独立した text にしてある（1 文字ごとに転がすため）。
       線幅はどのパーツも見た目 1.0 になるよう、各パーツの変換倍率で割り戻した値。 -->

  <g id="カード">
    <rect x="0.36" y="0.75" width="646.09" height="353.95" rx="16" ry="16"
          fill="#ffffff" stroke="#000000" stroke-width="1.48"/>
  </g>

  <g id="本棚">
    <rect id="背板" x="23.4" y="22.3" width="400.5" height="311" fill="rgb(239,169,77)"/>
    <rect id="棚-上" x="38.8" y="41.3" width="370" height="132" fill="rgb(167,117,22)"/>
    <rect id="棚-下" x="38.8" y="187.3" width="370" height="132" fill="rgb(167,117,22)"/>
  </g>

  <g id="ブロック" font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', serif"
     font-size="72" fill="#ffffff" text-anchor="middle">
    <g id="LLM">
      <rect x="49.75"  y="51.25" width="80" height="112" fill="rgb(0,96,0)"/>
      <rect x="139.75" y="51.25" width="80" height="112" fill="rgb(167,28,22)"/>
      <rect x="229.75" y="51.25" width="80" height="112" fill="rgb(0,20,160)"/>
      <text x="89.75"  y="132.25">L</text>
      <text x="179.75" y="132.25">L</text>
      <text x="269.75" y="132.25">M</text>
    </g>
    <g id="WIKI">
      <rect x="49.75"  y="197.25" width="80" height="112" fill="rgb(58,58,58)"/>
      <rect x="139.75" y="197.25" width="80" height="112" fill="rgb(0,96,0)"/>
      <rect x="229.75" y="197.25" width="80" height="112" fill="rgb(167,28,22)"/>
      <rect x="319.75" y="197.25" width="80" height="112" fill="rgb(0,20,160)"/>
      <text x="89.75"  y="278.25">W</text>
      <text x="179.75" y="278.25">I</text>
      <text x="269.75" y="278.25">K</text>
      <text x="359.75" y="278.25">I</text>
    </g>
  </g>

  <g id="積み本">
    <g id="積み本-上">
      <rect x="319.65" y="131.25" width="80" height="14" fill="rgb(0,20,160)"/>
      <rect x="323.8"  y="133.25" width="76" height="10" fill="rgb(204,204,204)"/>
    </g>
    <g id="積み本-下">
      <rect x="319.65" y="149.25" width="80" height="14" fill="rgb(0,96,0)"/>
      <rect x="323.8"  y="151.25" width="76" height="10" fill="rgb(204,204,204)"/>
    </g>
  </g>

  <!-- KIT。1 文字ずつ分けてあるが、送り幅の合計は "KIT" と同じなので見た目は変わらない -->
  <g id="KIT" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="96" fill="#000000">
    <text id="K" x="437.5" y="286.2">K</text>
    <text id="I" x="517.47" y="286.2">I</text>
    <text id="T" x="554.83" y="286.2">T</text>
  </g>

  <!-- アーム。fill と stroke の色は全パーツ共通 -->
  <g id="アーム" transform="matrix(0.530798,0,0,-0.530798,379.531,230.586)"
     fill="rgb(177,177,177)" stroke="#000000">

    <g id="取り付け台" transform="matrix(0.759259,0,0,1,89,0)">
      <rect x="270" y="401" width="162" height="32" stroke-width="2.162"/>
    </g>

    <g id="第1リンク" transform="matrix(1,0,0,1.184466,0,-73.970874)">
      <path d="M404,401L310,401L333.5,298L380.5,298Z" stroke-width="1.731"/>
    </g>

    <!-- 肩。回転中心 (355, 266) -->
    <g id="肩">
      <g id="第2リンク" transform="matrix(0.707107,-0.707107,0.707107,0.707107,-46.568123,367.53407)">
        <path d="M393,199L332,199L347.25,103L377.75,103Z" stroke-width="1.884"/>
      </g>
      <g id="肩の関節" transform="matrix(0.957447,0,0,0.967742,13.191489,9.314516)">
        <ellipse cx="357" cy="265.5" rx="47" ry="46.5" stroke-width="1.957"/>
      </g>

      <!-- 肘。回転中心 (282.59, 184.04) = 第2リンクの先端 -->
      <g id="肘">
       <!-- 前腕。円がリンクの先端から外れていたので、まとめてこの分だけ寄せてある -->
       <g id="前腕" transform="translate(6.59,-11.2)">
        <g id="第3リンク" transform="matrix(0,-1,1,0,117.783378,789.243281)">
          <path d="M616,151L570,151L581.5,77L604.5,77Z" stroke-width="1.884"/>
        </g>
        <g id="肘の関節" transform="matrix(0.820513,0,0,0.927536,-110.461538,67.707049)">
          <ellipse cx="471" cy="137.5" rx="39" ry="34.5" stroke-width="2.160"/>
        </g>

        <!-- 手首。回転中心 (184, 197) -->
        <g id="手首">
          <g id="掴んでいる本" transform="matrix(1.88395,0,0,-1.88395,-715.02,434.42)" stroke="none">
            <g transform="matrix(0.991638,0.129048,-0.129048,0.991638,-295.03,-451.53)">
              <g transform="matrix(0.634921,0,0,0.875,285.126984,60.75)">
                <rect x="718" y="470" width="126" height="16" fill="rgb(167,28,22)"/>
              </g>
              <g transform="matrix(0.603175,0,0,0.625,311.920635,180.257813)">
                <rect x="718" y="470" width="126" height="16" fill="rgb(204,204,204)"/>
              </g>
            </g>
          </g>
          <g id="爪-上" transform="matrix(0.439632,-0.368895,0.368895,0.439632,-125.94353,301.002317)">
            <path d="M450,217.233L449.58,217.476L424.776,162.514L435.168,156.514L463.008,195.243L524,195.243L524,219.243L450,219.243L450,217.233Z" stroke-width="3.282"/>
          </g>
          <g id="爪-下" transform="matrix(0.405808,0.405808,0.405808,-0.405808,-116.777601,63.09296)">
            <path d="M450,217.233L449.58,217.476L424.776,162.514L435.168,156.514L463.008,195.243L524,195.243L524,219.243L450,219.243L450,217.233Z" stroke-width="3.283"/>
          </g>
          <g id="手首の関節" transform="matrix(0.746269,0,0,0.70922,-207.634532,-25.62906)">
            <ellipse cx="524.5" cy="314.25" rx="33.5" ry="35.25" stroke-width="2.590"/>
          </g>
        </g>
       </g>
      </g>
    </g>
  </g>
</svg>
