config:
  MD001: false # 見出しレベル飛び許容
  MD009: false # 行末スペース許容（改行制御）
  MD012: false # 連続空行許容
  MD013: false # 行長制限なし（日本語）
  MD024: false # 重複見出し許容
  MD025: false # 単一 H1 ルール無効化（frontmatter title）
  MD026: false # 句読点付き見出し許容
  MD028: false # blockquote 内の空行許容
  MD033: false # インライン HTML 許容
  MD034: false # bare URL 許容
  MD036: false # 強調による見出し代用許容
  MD037: false # 強調内スペース許容（glob の ** が誤検出されるため）
  MD040: false # fenced code block の言語指定なし許容
  MD029: false # 順序リスト番号を連番強制しない
  MD032: false # リスト前後の空行を強制しない
  MD041: false # 最初の行が H1 でなくても OK（frontmatter）

ignores:
  - "**/node_modules/**" # 階層を問わず除外（worktree 配下の依存も含む）
  - ".claude/worktrees/**" # 作業コピーは正本側で lint 済み
